
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>siKENDALI - Bagian Organisasi</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .loader {
            width: 45px;
            height: 45px;
            border: 4px solid #334155;
            border-top-color: #818cf8;
            border-radius: 50%;
            margin: 25px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        p {
            color: #94a3b8;
            font-size: 14px;
        }

        a {
            color: #a5b4fc;
        }
    </style>

    <script>
        const APP_URL = "https://script.google.com/macros/s/AKfycbxwcUC6eEoTV1bZV5nWYAzFkFv-13784E-0ddYgGfy54nTz3vtyeiwPO8WRKoG6PEbRqg/exec";

        setTimeout(function() {
            window.location.replace(APP_URL);
        }, 1500);
    </script>
</head>

<body>
    <div>
        <h1>siKENDALI</h1>
        <p>BAGIAN ORGANISASI SEKRETARIAT DAERAH</p>
        <p>KABUPATEN BANYUWANGI</p>

        <div class="loader"></div>

        <p>Menghubungkan ke aplikasi...</p>

        <a href="https://script.google.com/macros/s/AKfycbxwcUC6eEoTV1bZV5nWYAzFkFv-13784E-0ddYgGfy54nTz3vtyeiwPO8WRKoG6PEbRqg/exec">
            Klik di sini jika tidak dialihkan
        </a>
    </div>
</body>
</html>
