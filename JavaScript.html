function initNotifikasiForm(){
  var bl=document.getElementById('notif-bulan');
  var th=document.getElementById('notif-tahun');
  if(bl&&!bl.children.length){
    var h='';
    for(var i=0;i<12;i++) h+='<option value="'+(i+1)+'">'+BULAN[i]+'</option>';
    bl.innerHTML=h;
  }
  if(th&&!th.children.length){
    var y=new Date().getFullYear(), h2='';
    for(var j=y;j>=y-1;j--) h2+='<option value="'+j+'">'+j+'</option>';
    th.innerHTML=h2;
  }
}

function generatePemberitahuan(btnEl){
  initNotifikasiForm();
  var blEl=document.getElementById('notif-bulan'), thEl=document.getElementById('notif-tahun');
  if(!blEl||!thEl||!blEl.value||!thEl.value){
    toast('Form belum siap','Pilih bulan & tahun, atau muat ulang halaman.','fas fa-triangle-exclamation','text-warning');
    return;
  }
  var btn=btnEl||document.getElementById('btn-notif-generate');
  if(!btn){ toast('Tombol tidak ditemukan','','fas fa-triangle-exclamation','text-warning'); return; }
  var oh=btn.innerHTML;
  function restore(){ try{ btn.innerHTML=oh; btn.disabled=false; }catch(e){} }
  btn.disabled=true;
  btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Membuat...';
  var watchdog=setTimeout(function(){
    restore();
    toast('Waktu Habis','Server tidak merespons >45 detik. Buka Executions di Apps Script untuk melihat apakah panggilan masuk / gagal.','fas fa-hourglass-end','text-warning');
  },45000);
  google.script.run
    .withSuccessHandler(function(r){
      clearTimeout(watchdog); restore();
      try{
        if(r&&r.success){
          notifPesan=r.pesan; notifBulan=r.bulanNama; notifTahun=r.tahun;
          var j=document.getElementById('notif-judul'), mt=document.getElementById('notif-meta'),
              pv=document.getElementById('notif-preview'), rs=document.getElementById('notif-result'),
              em=document.getElementById('notif-empty');
          if(j) j.textContent='Pemberitahuan '+r.bulanNama+' '+r.tahun;
          if(mt) mt.textContent='Disiapkan oleh '+r.dikirimOleh+' • Target: '+r.jumlahSKPD+' SKPD';
          if(pv) pv.textContent=r.pesan;
          if(rs) rs.style.display='block';
          if(em) em.style.display='none';
          toast('Siap Dikirim','Teks pemberitahuan berhasil dibuat','fas fa-check-circle','text-success');
        } else {
          console.error('generatePemberitahuanTPP gagal:', r);
          toast('Gagal',(r&&r.message)||'Server menolak permintaan','fas fa-times-circle','text-danger');
        }
      }catch(e){ console.error(e); toast('Error Tampilan',e.message,'fas fa-times-circle','text-danger'); }
    })
    .withFailureHandler(function(e){
      clearTimeout(watchdog); restore();
      console.error('Failure handler:', e);
      toast('Error',(e&&e.message)||String(e),'fas fa-times-circle','text-danger');
    })
    .generatePemberitahuanTPP(blEl.value, thEl.value, nid());
}

function copyNotifText(){

    navigator.clipboard.writeText(notifPesan).then(function(){ toast('Tersalin','Teks disalin ke clipboard','fas fa-copy','text-success'); });
  } else {
    var ta=document.createElement('textarea'); ta.value=notifPesan;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Tersalin','Teks disalin ke clipboard','fas fa-copy','text-success');
  }
}

var QR_LIBS=[
 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js',
 'https://unpkg.com/qrcode-generator@1.4.4/qrcode.js',
 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js'
];
function qrReady(){ return (typeof window.qrcode==='function')||(window.QRCode&&typeof window.QRCode.toDataURL==='function'); }
function loadScriptOnce(src){
  return new Promise(function(res,rej){
    var s=document.createElement('script'); s.src=src; s.async=true;
    s.onload=function(){ res(src); };
    s.onerror=function(){ rej(new Error('gagal memuat '+src)); };
    document.head.appendChild(s);
  });
}
function ensureQRLib(){
  if(qrReady()) return Promise.resolve(true);
  var chain=Promise.reject(new Error('belum ada pustaka'));
  QR_LIBS.forEach(function(u){
    chain=chain.catch(function(){
      return loadScriptOnce(u).then(function(){ if(!qrReady()) throw new Error('pustaka tidak aktif'); return true; });
    });
  });
  return chain.catch(function(){ throw new Error('Pustaka QR tidak dapat dimuat dari semua CDN. Periksa koneksi/kebijakan jaringan.'); });
}
function qrViaGenerator(text){
  var qr=window.qrcode(0,'M'); qr.addData(String(text)); qr.make();
  var n=qr.getModuleCount(), quiet=2, scale=Math.max(4,Math.ceil(380/(n+quiet*2)));
  var size=(n+quiet*2)*scale;
  var cv=document.createElement('canvas'); cv.width=size; cv.height=size;
  var ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,size,size);
  ctx.fillStyle='#0f172a';
  for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(qr.isDark(r,c)) ctx.fillRect((c+quiet)*scale,(r+quiet)*scale,scale,scale);
  return cv.toDataURL('image/png');
}
function makeQR(text){
  var t=String(text||'');
  if(!t) return Promise.reject(new Error('Data QR kosong.'));
  return ensureQRLib().then(function(){
    if(typeof window.qrcode==='function') return qrViaGenerator(t);
    return new Promise(function(res,rej){
      window.QRCode.toDataURL(t,{errorCorrectionLevel:'M',margin:2,width:420,color:{dark:'#0f172a',light:'#ffffff'}},
        function(e,u){ if(e) rej(e); else res(u); });
    });
  });
}

function handleLogin(e){

    if(res&&res.success){
      currentUser=res.user;
      document.getElementById('login-screen').style.display='none';

      var ini=(currentUser.nama||'U').charAt(0).toUpperCase(),el;

      el=document.getElementById('profile-opd'); if(el) el.innerText=currentUser.opd||'-';

      if(sl){ var list=currentUser.skpdList||[],h='';
        if(list.length&&!isSuper()){ h='<p class="text-xs text-muted mb-2">Wilayah tanggung jawab ('+list.length+' SKPD):</p><div style="display:flex;flex-wrap:wrap;gap:5px;">';
          for(var i=0;i<list.length;i++) h+='<span class="badge badge-info">'+esc(list[i])+'</span>'; h+='</div>'; }
        else if(isSuper()) h='<span class="badge badge-super"><i class="fas fa-crown" style="margin-right:5px;"></i>Akses seluruh 54 SKPD</span>';
        sl.innerHTML=h; }

      yearOptions('tpp-isi-tahun',defY); yearOptions('tpp-mon-tahun',defY); yearOptions('tpp-rekap-tahun',defY); yearOptions('tpp-ba-tahun',defY);

        for(var k=0;k<all.length;k++) oh+='<option value="'+esc(all[k])+'">'+esc(all[k])+'</option>';
        if(ps){ ps.innerHTML=oh; ps.classList.remove('hidden'); }
        if(ts){ ts.innerHTML=oh; ts.classList.remove('hidden'); } }
      else { if(ps) ps.classList.add('hidden'); if(ts) ts.classList.add('hidden'); }
      applyRoleAccess(); applySidebarPreference();
      if(isInternal()){ loadPegawai(); loadTemplates(); loadBankMeta(); }
      showSection('dashboard',document.querySelector('.menu-item[data-page="dashboard"]'));
      toast('Login Berhasil','Selamat datang, '+currentUser.nama,'fas fa-user-check','text-success');
    } else err.innerText=(res&&res.message)?res.message:'NIP atau Password salah.';
  }).withFailureHandler(function(er){ btn.innerHTML='<i class="fas fa-sign-in-alt"></i> Masuk'; btn.disabled=false;

function paginate(cid,cur,total,fn,count,per){
  var c=document.getElementById(cid); if(!c) return; per=per||ITEMS_PER_PAGE;
  if(total<=1){ c.innerHTML=count?'<div class="pagination-info">Menampilkan '+count+' data</div>':''; return; }

  var h='<div class="pagination-info">'+from+'–'+to+' dari '+count+' data</div><div class="pagination-controls">';
  h+='<button class="page-btn" '+(cur===1?'disabled':'')+' onclick="'+fn+'(1)"><i class="fas fa-angle-double-left"></i></button>';
  h+='<button class="page-btn" '+(cur===1?'disabled':'')+' onclick="'+fn+'('+(cur-1)+')"><i class="fas fa-chevron-left"></i></button>';
  var sp=Math.max(1,cur-2),ep=Math.min(total,sp+4); if(ep-sp<4) sp=Math.max(1,ep-4);

  h+='<button class="page-btn" '+(cur===total?'disabled':'')+' onclick="'+fn+'('+(cur+1)+')"><i class="fas fa-chevron-right"></i></button>';
  h+='<button class="page-btn" '+(cur===total?'disabled':'')+' onclick="'+fn+'('+total+')"><i class="fas fa-angle-double-right"></i></button></div>';

function parseTimeTo24(t){ if(!t) return ''; var s=String(t).trim().toUpperCase();
  var m=s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if(m){ var h=parseInt(m[1],10); if(m[3].toUpperCase()==='PM'&&h<12)h+=12; if(m[3].toUpperCase()==='AM'&&h===12)h=0; return String(h).padStart(2,'0')+':'+m[2]; }
  var m2=s.match(/^(\d{1,2}):(\d{2})$/); if(m2) return m2[1].padStart(2,'0')+':'+m2[2]; return s; }

function filterAgenda(f,btn){
  var t=new Date(); t.setHours(0,0,0,0); var tm=new Date(t); tm.setDate(tm.getDate()+1);
  if(f==='hari-ini') currentFilteredAgenda=allAgenda.filter(function(a){ if(!a.tanggal_mulai) return false; var d=new Date(a.tanggal_mulai); return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate(); });
  else if(f==='besok') currentFilteredAgenda=allAgenda.filter(function(a){ if(!a.tanggal_mulai) return false; var d=new Date(a.tanggal_mulai); return d.getFullYear()===tm.getFullYear()&&d.getMonth()===tm.getMonth()&&d.getDate()===tm.getDate(); });
  else if(f==='terlewati') currentFilteredAgenda=allAgenda.filter(function(a){ if(!a.tanggal_selesai) return false; var d=new Date(a.tanggal_selesai); d.setHours(0,0,0,0); return d<t; });
  else currentFilteredAgenda=allAgenda;
  if(btn&&btn.parentNode){ var bs=btn.parentNode.querySelectorAll('.filter-btn'); for(var i=0;i<bs.length;i++) bs[i].className='filter-btn'; btn.className='filter-btn active'; }
  currentAgendaPage=1; renderAgendaTable();

function setupDragDrop(){
  var z=document.getElementById('upload-zone');
  if(z){ ['dragenter','dragover'].forEach(function(e){ z.addEventListener(e,function(ev){ ev.preventDefault(); z.classList.add('dragover'); }); });
    ['dragleave','drop'].forEach(function(e){ z.addEventListener(e,function(ev){ ev.preventDefault(); z.classList.remove('dragover'); }); });
    z.addEventListener('drop',function(ev){ handleFiles(ev.dataTransfer.files); }); }
  var b=document.getElementById('bd-dropzone');
  if(b){ ['dragenter','dragover'].forEach(function(e){ b.addEventListener(e,function(ev){ ev.preventDefault(); b.classList.add('dragover'); }); });
    ['dragleave','drop'].forEach(function(e){ b.addEventListener(e,function(ev){ ev.preventDefault(); b.classList.remove('dragover'); }); });
    b.addEventListener('drop',function(ev){ if(ev.dataTransfer.files.length) processBankFile(ev.dataTransfer.files[0]); }); }
}
function handleFileSelect(ev){ handleFiles(ev.target.files); ev.target.value=''; }
function handleFiles(fs){ for(var i=0;i<fs.length;i++){ if(fs[i].size>50*1024*1024){ toast('File Besar',fs[i].name+' melebihi 50MB','fas fa-exclamation-triangle','text-danger'); continue; } uploadFile(fs[i]); } }
function uploadFile(file){
  var rd=new FileReader(),tid='temp-'+Date.now()+'-'+Math.random().toString(36).substr(2,5);
  var pl=document.getElementById('media-preview-list'),pi=document.createElement('div');
  pi.className='media-preview-item'; pi.id=tid;
  pi.innerHTML='<div style="width:80px;height:80px;background:var(--bg-muted);border-radius:8px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-spinner fa-spin text-2xl text-primary"></i></div>';
  pl.appendChild(pi);
  rd.onload=function(e){ var b64=e.target.result.split(',')[1];
    google.script.run.withSuccessHandler(function(r){
      if(r&&r.success){ uploadedMediaList.push(r); updateMediaHidden();
        var du=r.displayUrl||('https://lh3.googleusercontent.com/d/'+r.id);
        var th=r.isVideo?'<div style="width:80px;height:80px;background:#334155;border-radius:8px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-video text-xl" style="color:#fff;"></i></div>':'<img src="'+du+'" style="width:80px;height:80px;object-fit:cover;border-radius:8px;">';
        pi.innerHTML=th+'<div class="remove-btn" onclick="removeUploadedMedia(\''+r.id+'\',\''+tid+'\')"><i class="fas fa-times"></i></div>'; }
      else { pi.innerHTML='<div style="width:80px;height:80px;background:rgba(239,68,68,.12);border-radius:8px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-times text-xl text-danger"></i></div>'; toast('Upload Gagal',(r&&r.error)||file.name,'fas fa-times-circle','text-danger'); }
    }).withFailureHandler(function(er){ pi.innerHTML='<div style="width:80px;height:80px;background:rgba(239,68,68,.12);border-radius:8px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-times text-xl text-danger"></i></div>'; fail(er); }).uploadMediaToDrive(b64,file.name,file.type,nid()); };
  rd.readAsDataURL(file);
}
function removeUploadedMedia(mid,tid){ if(!confirm('Hapus file ini?')) return;
  google.script.run.deleteMediaFromDrive(mid);
  var nl=[]; for(var i=0;i<uploadedMediaList.length;i++) if(uploadedMediaList[i].id!==mid) nl.push(uploadedMediaList[i]);

function initSigPad(target){
  var cv=document.getElementById('sig-canvas-'+target); if(!cv) return;
  var p=sigPads[target]; p.cv=cv; p.ctx=cv.getContext('2d');
  resizeSig(target);
  if(cv.dataset.bound==='1') return; cv.dataset.bound='1'; p.empty=true;
  function pos(ev){ var r=cv.getBoundingClientRect(),t=ev.touches?ev.touches[0]:ev; return {x:t.clientX-r.left,y:t.clientY-r.top}; }
  function down(ev){ ev.preventDefault(); p.drawing=true; p.last=pos(ev); }
  function move(ev){ if(!p.drawing) return; ev.preventDefault(); var q=pos(ev),ctx=p.ctx;
    ctx.beginPath(); ctx.moveTo(p.last.x,p.last.y); ctx.lineTo(q.x,q.y); ctx.stroke(); p.last=q; p.empty=false; }
  function up(){ p.drawing=false; }
  cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',up);

function trimCanvas(cv){
  var ctx=cv.getContext('2d'),w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data;

  if(maxX<0) return null;
  var pad=8,cw=(maxX-minX+1)+pad*2,ch=(maxY-minY+1)+pad*2;

  out.getContext('2d').drawImage(cv,minX,minY,maxX-minX+1,maxY-minY+1,pad,pad,maxX-minX+1,maxY-minY+1);

function getFilteredMonRows(){
  if(!tppMonData) return [];
  var q=(document.getElementById('tpp-mon-search').value||'').toLowerCase();
  var f=document.getElementById('tpp-mon-filter').value;
  var pic=document.getElementById('tpp-mon-pic').value;
  return tppMonData.rows.filter(function(r){
    if(pic&&(r.pic_nip||'-')!==pic) return false;
    if(q&&(r.skpd+' '+r.pic_nama).toLowerCase().indexOf(q)===-1) return false;
    if(f==='lengkap'&&r.lengkap!==12) return false;
    if(f==='proses'&&!(r.lengkap>0&&r.lengkap<12)) return false;
    if(f==='kosong'&&r.lengkap+r.sebagian!==0) return false;

    return true; });

function qrBtn(sig){

  var revoked=String(sig.status)==='DICABUT';
  return '<button onclick="showQRInfo(\''+esc(tk)+'\')" class="btn btn-secondary btn-sm" title="'+esc(sig.nama)+' • '+esc(sig.tgl||sig.waktu)+'">'+
    '<i class="fas fa-qrcode"></i> '+lbl+(revoked?' <i class="fas fa-ban" style="color:var(--danger);"></i>':'')+'</button>';
}

function loadUsers(){

function updateUserStats(){
  var s={total:allUsers.length,superadmin:0,internal:0,opd:0};
  for(var i=0;i<allUsers.length;i++){ var r=allUsers[i].role; if(r==='Superadmin')s.superadmin++; else if(r==='TeamInternal')s.internal++; else s.opd++; }
  var e;
  e=document.getElementById('ustat-total'); if(e) e.textContent=s.total;
  e=document.getElementById('ustat-super'); if(e) e.textContent=s.superadmin;
  e=document.getElementById('ustat-internal'); if(e) e.textContent=s.internal;
  e=document.getElementById('ustat-opd'); if(e) e.textContent=s.opd;
}
function roleBadge(r){
  if(r==='Superadmin') return '<span class="badge badge-super"><i class="fas fa-crown" style="margin-right:5px;"></i>Superadmin</span>';
  if(r==='TeamInternal') return '<span class="badge badge-internal"><i class="fas fa-user-shield" style="margin-right:5px;"></i>Team Internal</span>';
  return '<span class="badge badge-opd"><i class="fas fa-building" style="margin-right:5px;"></i>User OPD</span>';

function applyUserFilters(){
  var q=(document.getElementById('user-search').value||'').toLowerCase(),rf=document.getElementById('user-filter-role').value;

function loadOpdList(cb){
  google.script.run.withSuccessHandler(function(l){

function onUserRoleChange(){
  var r=document.getElementById('user-role').value,s=document.getElementById('user-opd'),m=document.getElementById('user-opd-manual');
  if(r==='UserOPD'){ s.classList.remove('hidden'); m.classList.add('hidden'); }
  else { s.classList.add('hidden'); m.classList.remove('hidden'); }
}
function openUserModal(mode,nip){
  document.getElementById('modal-user').classList.remove('hidden'); document.body.style.overflow='hidden';
  var t=document.getElementById('user-modal-title'),nf=document.getElementById('user-nip'),pw=document.getElementById('user-pass-wrap');
  if(mode==='add'){
    t.innerText='Tambah User Baru'; document.getElementById('user-edit-nip').value='';
    nf.value=''; nf.disabled=false; document.getElementById('user-nama').value='';
    document.getElementById('user-role').value='UserOPD'; document.getElementById('user-password').value='password123';
    document.getElementById('user-opd-manual').value=''; pw.style.display='block'; onUserRoleChange();
    loadOpdList(function(){ document.getElementById('user-opd').value=''; });
  } else {
    var u=null; for(var i=0;i<allUsers.length;i++) if(allUsers[i].nip===nip){ u=allUsers[i]; break; }
    if(!u){ closeUserModal(); return; }
    t.innerText='Edit User: '+u.nama; document.getElementById('user-edit-nip').value=u.nip;
    nf.value=u.nip; nf.disabled=true; document.getElementById('user-nama').value=u.nama;
    document.getElementById('user-role').value=u.role; pw.style.display='none'; onUserRoleChange();
    loadOpdList(function(){
      if(u.role==='UserOPD'){
        var s=document.getElementById('user-opd'); s.value=u.opd||'';
        if(s.value!==(u.opd||'')){ var o=document.createElement('option'); o.value=u.opd; o.text=u.opd; s.appendChild(o); s.value=u.opd; }
      } else document.getElementById('user-opd-manual').value=u.opd||'';
    });
  }
}
function closeUserModal(){ document.getElementById('modal-user').classList.add('hidden'); document.body.style.overflow=''; }
function saveUser(e){
  if(e) e.preventDefault();
  var en=document.getElementById('user-edit-nip').value,r=document.getElementById('user-role').value;
  var opd=r==='UserOPD'?document.getElementById('user-opd').value:document.getElementById('user-opd-manual').value;
  var o={nip:document.getElementById('user-nip').value.trim(),nama:document.getElementById('user-nama').value.trim(),
    role:r,opd:opd||'-',password:document.getElementById('user-password').value||'password123'};
  if(!o.nip||!o.nama){ toast('Lengkapi Data','ID/NIP dan Nama wajib diisi','fas fa-triangle-exclamation','text-warning'); return; }
  var b=document.getElementById('btn-save-user'),oh=b.innerHTML;
  b.innerHTML='<i class="fas fa-spinner fa-spin"></i> Menyimpan...'; b.disabled=true;
  function ok(res){ b.innerHTML=oh; b.disabled=false;
    if(res&&res.success){ toast('Berhasil',res.message,'fas fa-check-circle','text-success'); closeUserModal(); loadUsers(); }
    else toast('Gagal',(res&&res.message)||'Gagal','fas fa-times-circle','text-danger'); }
  function no(er){ b.innerHTML=oh; b.disabled=false; fail(er); }
  if(en) google.script.run.withSuccessHandler(ok).withFailureHandler(no).updateUser(en,o,nid());
  else google.script.run.withSuccessHandler(ok).withFailureHandler(no).addUser(o,nid());
}
function adminResetPassword(nip){
  if(!confirm('Reset password user ini ke "password123"?')) return;
  google.script.run.withSuccessHandler(function(r){ var s=r&&r.success;
    toast(s?'Berhasil':'Gagal',(r&&r.message)||'Gagal',s?'fas fa-key':'fas fa-times-circle',s?'text-warning':'text-danger'); loadUsers();
  }).withFailureHandler(fail).resetUserPassword(nip,nid());

function adminDeleteUser(nip){
  if(!confirm('Hapus user ini secara permanen?')) return;
  google.script.run.withSuccessHandler(function(r){ var s=r&&r.success;
    toast(s?'Terhapus':'Gagal',(r&&r.message)||'Gagal',s?'fas fa-trash':'fas fa-times-circle',s?'text-success':'text-danger'); loadUsers();
  }).withFailureHandler(fail).deleteUser(nip,nid());
}

function tppCheck(skpd,y,bl,which,m,canEdit){

var disabled=!canEdit||m.locked||baHist(m)||!m.eligible||!win.open;
var id='chk-'+which+'-'+bl;
var note=on?esc(when):(baHist(m)?'Data historis':(m.locked?'Terkunci':(!m.eligible?'Belum dapat disetujui':(!win.open?'Dibuka '+esc(win.label):'Belum dikonfirmasi'))));
return '<label for="'+id+'" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-md);border:1.5px solid '+(on?'var(--success)':'var(--border)')+';background:'+(on?'rgba(16,185,129,.07)':'var(--bg-muted)')+';cursor:'+(disabled?'not-allowed':'pointer')+';'+(disabled?'opacity:.75;':'')+'">'+
'<input type="checkbox" id="'+id+'" '+(on?'checked':'')+' '+(disabled?'disabled':'')+' onchange="toggleTPP(\''+esc(skpd)+'\','+y+','+bl+',\''+which+'\',this)" style="width:22px;height:22px;flex-shrink:0;accent-color:#10b981;">'+
'<div style="min-width:0;flex:1;"><p style="font-weight:700;font-size:.8125rem;color:var(--text-primary);">Tanggal '+which+(baHist(m)?' <i class="fas fa-clock-rotate-left" style="font-size:9px;color:var(--text-muted);"></i>':(m.locked?' <i class="fas fa-lock" style="font-size:9px;color:var(--secondary);"></i>':''))+'</p><p class="text-xs text-muted">'+note+'</p></div></label>';
}
function baActions(skpd,y,bl,m){
var s=esc(skpd), h='';
if(baHist(m)) return '<div style="padding:10px;border-radius:var(--radius-md);background:var(--bg-muted);border:1px dashed var(--border);">'+
'<p class="text-xs font-bold text-muted"><i class="fas fa-clock-rotate-left mr-1"></i>Periode historis pra-aplikasi</p>'+
'<p class="text-xs text-muted mt-1">Persetujuan sudah dicatat melalui migrasi data. Tidak memerlukan Berita Acara maupun tanda tangan.</p></div>';
if(m.status!=='Lengkap') return '<p class="text-xs text-muted"><i class="fas fa-circle-info mr-1"></i>Lengkapi kedua konfirmasi untuk membuat Berita Acara.</p>';
if(!m.ba_file_id) return '<button onclick="buatBA(\''+s+'\','+y+','+bl+')" class="btn btn-primary btn-sm w-full"><i class="fas fa-file-signature"></i> Buat Berita Acara</button>';
h+='<div class="text-xs text-success mb-2"><i class="fas fa-circle-check mr-1"></i>'+esc(m.ba_nomor)+'</div>';
h+='<div style="display:flex;gap:6px;flex-wrap:wrap;">'+
'<button onclick="previewDrive(\''+m.ba_file_id+'\',\'Berita Acara\')" class="btn btn-secondary btn-sm" style="flex:1;"><i class="fas fa-file-lines"></i> Dokumen</button>'+
'<button onclick="window.open(\''+driveDownload(m.ba_file_id)+'\',\'_blank\')" class="btn btn-success btn-sm"><i class="fas fa-download"></i></button>';
if(!baFinal(m)&&canTPPWrite()&&String(tppConfig.IZINKAN_CETAK_ULANG_BA||'YA').toUpperCase()==='YA')
h+='<button onclick="buatBA(\''+s+'\','+y+','+bl+')" class="btn btn-secondary btn-sm" title="Buat ulang"><i class="fas fa-rotate"></i></button>';
h+='</div>';
if(m.sig_admin||m.sig_kepala) h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">'+qrBtn(m.sig_admin)+qrBtn(m.sig_kepala)+'</div>';
if(baFull(m)){
h+='<div style="margin-top:10px;padding:10px;border-radius:var(--radius-md);background:rgba(139,92,246,.07);border:1px solid var(--secondary);">'+
'<p class="text-xs font-bold" style="color:var(--secondary);"><i class="fas fa-qrcode mr-1"></i>FINAL — tanda tangan elektronik lengkap</p>'+
'<p class="text-xs text-muted mt-1">Tidak perlu unggah dokumen lagi.</p></div>';
} else if(m.final_file_id){
h+='<div style="margin-top:10px;padding:10px;border-radius:var(--radius-md);background:rgba(16,185,129,.07);border:1px solid var(--success);">'+
'<p class="text-xs font-bold text-success"><i class="fas fa-stamp mr-1"></i>FINAL — dokumen bertanda tangan &amp; stempel</p>'+
'<p class="text-xs text-muted mt-1" style="word-break:break-all;">'+esc(m.final_name)+' • '+fmtSize(m.final_size)+'</p>'+
'<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">'+
'<button onclick="previewDrive(\''+m.final_file_id+'\',\'BA Bertanda Tangan\')" class="btn btn-primary btn-sm" style="flex:1;"><i class="fas fa-eye"></i> Lihat</button>'+
'<button onclick="window.open(\''+driveDownload(m.final_file_id)+'\',\'_blank\')" class="btn btn-success btn-sm"><i class="fas fa-download"></i></button>'+
(canTPPWrite()?'<button onclick="askUploadBAFinal(\''+s+'\','+y+','+bl+')" class="btn btn-secondary btn-sm"><i class="fas fa-rotate"></i></button>'+
'<button onclick="deleteBAFinal(\''+s+'\','+y+','+bl+')" class="btn btn-danger btn-sm"><i class="fas fa-trash"></i></button>':'')+'</div></div>';
} else if(canTPPWrite()){
h+='<button onclick="askUploadBAFinal(\''+s+'\','+y+','+bl+')" class="btn btn-warning btn-sm w-full" style="margin-top:10px;"><i class="fas fa-upload"></i> Unggah BA Bertanda Tangan &amp; Stempel</button>';
} else {
h+='<p class="text-xs text-warning mt-2"><i class="fas fa-hourglass-half mr-1"></i>Menunggu unggahan dokumen final dari admin OPD.</p>';
}
return h;
}

function renderTPPMonitor(){

var c=document.getElementById('tpp-mon-container'),st=document.getElementById('tpp-mon-stats');
var rows=getFilteredMonRows();

for(var i=0;i<rows.length;i++){ var x=rows[i]; tl+=x.lengkap; tba+=x.ba_count; tfin+=x.final_count;
for(var j=0;j<12;j++){ if(x.months[j].tgl7) si++; if(x.months[j].tgl10) si++; if(x.months[j].locked) lk++; } }
var tot=rows.length*24,pct=tot?Math.round(si/tot*100):0;
if(st) st.innerHTML=statCard('fa-building','var(--primary)','rgba(99,102,241,.1)',rows.length,'SKPD Ditampilkan')+
statCard('fa-circle-check','var(--success)','rgba(16,185,129,.1)',tl,'Bulan Lengkap')+
statCard('fa-file-signature','var(--accent)','rgba(236,72,153,.1)',tba,'Dokumen BA')+
statCard('fa-circle-check','var(--secondary)','rgba(139,92,246,.1)',tfin,'Bulan Tuntas');

progressBar(pct,'Kelengkapan konfirmasi '+(picName?'wilayah '+picName:'seluruh wilayah')+' tahun '+tppMonData.year);
if(!rows.length){ c.innerHTML=h+'<div class="form-card text-center text-muted"><i class="fas fa-search text-2xl mb-2 block"></i>Tidak ada SKPD yang cocok dengan filter.</div>'; return; }
h+='<div class="table-wrapper"><div class="table-scroll"><table class="data-table" style="min-width:1250px;"><thead><tr><th style="position:sticky;left:0;background:var(--bg-muted);z-index:2;min-width:250px;">SKPD / PIC</th>';
for(var k=0;k<12;k++) h+='<th class="col-actions">'+BULAN_S[k]+'</th>';
h+='<th class="col-actions">Progres</th></tr></thead><tbody>';
for(var a=0;a<rows.length;a++){ var r=rows[a];
h+='<tr><td style="position:sticky;left:0;background:var(--bg-surface);z-index:1;"><div style="font-weight:700;font-size:.8125rem;color:var(--text-primary);">'+esc(r.skpd)+'</div>'+
'<div class="text-xs text-muted"><i class="fas fa-user-shield mr-1"></i>'+esc(r.pic_nama)+'</div></td>';
for(var b=0;b<12;b++){ var m=r.months[b];
var icon=baHist(m)?'<i class="fas fa-clock-rotate-left" style="font-size:8px;color:var(--text-muted);"></i>':
(baFull(m)?'<i class="fas fa-qrcode" style="font-size:8px;color:var(--secondary);"></i>':
(baFinal(m)?'<i class="fas fa-stamp" style="font-size:8px;color:var(--success);"></i>':
(m.locked?'<i class="fas fa-lock" style="font-size:8px;color:var(--accent);"></i>':'')));
var bd=baHist(m)?'var(--border)':(baFinal(m)?'var(--secondary)':(m.locked?'var(--accent)':'var(--border)'));
h+='<td class="col-actions"><button onclick="showTPPDetail(\''+esc(r.skpd)+'\','+tppMonData.year+','+(b+1)+')" style="display:inline-flex;flex-direction:column;gap:2px;align-items:center;padding:5px 7px;border-radius:var(--radius-sm);border:1px solid '+bd+';background:var(--bg-muted);cursor:pointer;" title="'+BULAN[b]+': '+m.status+(baHist(m)?' • historis':(baFinal(m)?' • tuntas':''))+'">'+

var pc=r.progress,cl=pc>=100?'var(--success)':(pc>=50?'var(--primary)':'var(--warning)');

// ===== HAPUS DATA PERIODE TPP (Superadmin) =====
var NLH=String.fromCharCode(10);

function hapusPeriodeTPP(skpd,y,bl){
if(!isSuper()){ toast('Tidak Berwenang','Hanya Superadmin.','fas fa-lock','text-warning'); return; }
var msg=['HAPUS PERMANEN data periode '+BULAN[bl-1]+' '+y+'?','SKPD: '+skpd,'',
'Yang akan dihapus:',
'• Centang tanggal 7 & tanggal 10',
'• Draft Berita Acara + file unggahan (ke Trash Drive)',
'• Tanda tangan elektronik (dicabut)',
'• Baris pada sheet Data_TPP','',
'Bulan ini akan kembali kosong. Tindakan ini tidak dapat dibatalkan dari aplikasi.'].join(NLH);
if(!confirm(msg)) return;
toast('Menghapus','Memproses penghapusan...','fas fa-spinner fa-spin','text-primary');
google.script.run.withSuccessHandler(function(r){
if(r&&r.success){ toast('Terhapus',r.message,'fas fa-trash','text-success'); closeTPPModal(); refreshTPPViews(); }
else toast('Gagal',(r&&r.message)||'Gagal menghapus','fas fa-times-circle','text-danger');
}).withFailureHandler(fail).deleteTPPPeriode(skpd,y,bl,nid());
}

function ensureHapusMassalBtn(){
if(!isSuper()) return;
var page=document.getElementById('tpp-monitor'); if(!page) return;
var bar=page.querySelector('.section-actions'); if(!bar) return;
if(document.getElementById('btn-hapus-massal')) return;
var b=document.createElement('button');
b.id='btn-hapus-massal'; b.className='btn btn-danger btn-sm';
b.innerHTML='<i class="fas fa-trash-can"></i> Hapus Massal per Bulan';
b.onclick=hapusMassalTPP;
bar.appendChild(b);
}

function loadTPPMonitor(){
var y=Number(document.getElementById('tpp-mon-tahun').value)||new Date().getFullYear();
var c=document.getElementById('tpp-mon-container');
if(c) c.innerHTML='<div class="form-card text-center text-muted"><i class="fas fa-circle-notch fa-spin mr-2"></i>Memuat monitoring...</div>';
google.script.run.withSuccessHandler(function(r){
if(!r||!r.success){ if(c) c.innerHTML='<div class="form-card text-danger">'+esc((r&&r.message)||'Gagal')+'</div>'; return; }
tppMonData=r; tppConfig=r.config||{};
fillPicFilter('tpp-mon-pic',r.picList,true);
var sub=document.getElementById('tpp-mon-subtitle');
if(sub) sub.textContent=(r.role==='Superadmin'?'Seluruh 54 SKPD':'Wilayah binaan '+r.nama)+' • Tahun '+r.year;
var pb=document.getElementById('tpp-mon-periode'); if(pb) pb.innerHTML=periodeBanner(r.periodeAktif);
ensureHapusMassalBtn();
renderTPPMonitor();
}).withFailureHandler(function(er){ if(c) c.innerHTML='<div class="form-card text-danger">'+esc(er.message)+'</div>'; }).getTPPMatrix(y,nid());
}

function hitungDataBulan(bl){
if(!tppMonData) return 0;
var n=0;
for(var i=0;i<tppMonData.rows.length;i++){ var m=tppMonData.rows[i].months[bl-1]; if(m&&m.id) n++; }
return n;
}

function hapusMassalTPP(){
if(!isSuper()){ toast('Tidak Berwenang','Hanya Superadmin.','fas fa-lock','text-warning'); return; }
if(!tppMonData){ toast('Belum Siap','Buka Monitoring Wilayah terlebih dahulu.','fas fa-circle-info','text-warning'); return; }
var th=tppMonData.year, def=new Date().getMonth()+1;
var old=document.getElementById('modal-hapus-tpp'); if(old) old.remove();
var opts='';
for(var i=1;i<=12;i++) opts+='<option value="'+i+'"'+(i===def?' selected':'')+'>'+BULAN[i-1]+' ('+hitungDataBulan(i)+' data)</option>';
var wrap=document.createElement('div');
wrap.id='modal-hapus-tpp';
wrap.style.cssText='position:fixed;inset:0;z-index:245;';
wrap.innerHTML='<div class="modal-backdrop" onclick="tutupHapusMassal()"></div>'+
'<div class="modal-content" style="max-width:520px;">'+
'<div class="modal-header" style="background:linear-gradient(135deg,#ef4444,#b91c1c);">'+
'<div style="min-width:0;flex:1;"><h3>Hapus Massal Data Periode</h3>'+
'<p class="text-xs mt-0.5" style="opacity:.9;">Tahun '+th+' • seluruh SKPD pada bulan terpilih</p></div>'+
'<button onclick="tutupHapusMassal()" class="modal-close"><i class="fas fa-times"></i></button></div>'+
'<div class="modal-body">'+
'<div class="form-card" style="margin:0 0 14px;background:rgba(239,68,68,.07);border-left:4px solid var(--danger);">'+
'<p class="text-sm" style="color:var(--text-secondary);"><i class="fas fa-triangle-exclamation text-danger mr-1"></i>'+
'Seluruh centang, draft Berita Acara, file unggahan, dan tanda tangan elektronik pada bulan terpilih akan dihapus. '+
'File dipindah ke Trash Drive (dapat dipulihkan ±30 hari), namun baris data dihapus permanen.</p></div>'+
'<div class="form-row"><div><label class="form-label">Bulan</label>'+
'<select id="hm-bulan" class="form-select" onchange="updateHapusMassalInfo()">'+opts+'</select></div></div>'+
'<div id="hm-info" class="form-card" style="margin:0 0 14px;"></div>'+
'<div class="form-row"><div><label class="form-label">Ketik <strong>HAPUS</strong> untuk konfirmasi</label>'+
'<input type="text" id="hm-konfirm" class="form-input" placeholder="HAPUS" autocomplete="off" oninput="updateHapusMassalInfo()"></div></div>'+
'<div class="flex flex-wrap gap-3 pt-4 border-t" style="border-color:var(--border);">'+
'<button id="hm-proses" onclick="prosesHapusMassal()" class="btn btn-danger" disabled><i class="fas fa-trash-can"></i> Hapus Permanen</button>'+
'<button onclick="tutupHapusMassal()" class="btn btn-secondary">Batal</button></div>'+
'</div></div>';
document.body.appendChild(wrap);
document.body.style.overflow='hidden';
updateHapusMassalInfo();
}

function updateHapusMassalInfo(){
var blEl=document.getElementById('hm-bulan'), info=document.getElementById('hm-info'),
btn=document.getElementById('hm-proses'), kf=document.getElementById('hm-konfirm');
if(!blEl||!info||!btn) return;
var bl=Number(blEl.value), n=hitungDataBulan(bl);
info.innerHTML=n
?'<p class="text-sm font-bold" style="color:var(--danger);">'+n+' data SKPD akan dihapus</p><p class="text-xs text-muted mt-1">Periode '+BULAN[bl-1]+' '+tppMonData.year+'</p>'
:'<p class="text-sm text-muted"><i class="fas fa-circle-info mr-1"></i>Tidak ada data pada bulan ini — tidak ada yang perlu dihapus.</p>';
btn.disabled=!(n>0&&kf&&String(kf.value).trim().toUpperCase()==='HAPUS');
}

function tutupHapusMassal(){
var m=document.getElementById('modal-hapus-tpp'); if(m) m.remove();
document.body.style.overflow='';
}

function prosesHapusMassal(){
var bl=Number(document.getElementById('hm-bulan').value), th=tppMonData.year;
var btn=document.getElementById('hm-proses'), oh=btn.innerHTML;
btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Menghapus...';
google.script.run.withSuccessHandler(function(r){
btn.innerHTML=oh;
if(r&&r.success){ toast('Terhapus',r.message,'fas fa-trash','text-success'); tutupHapusMassal(); loadTPPMonitor(); }
else { btn.disabled=false; toast('Gagal',(r&&r.message)||'Gagal','fas fa-times-circle','text-danger'); }
}).withFailureHandler(function(e){ btn.innerHTML=oh; btn.disabled=false; fail(e); }).deleteTPPPeriodeBulk(th,bl,nid());
}

function showTPPDetail(skpd,y,bl){
document.getElementById('modal-tpp-title').textContent=BULAN[bl-1]+' '+y;
document.getElementById('modal-tpp-sub').textContent=skpd;
document.getElementById('modal-tpp-body').innerHTML='<p class="text-center text-muted"><i class="fas fa-circle-notch fa-spin mr-2"></i>Memuat...</p>';
document.getElementById('modal-tpp').classList.remove('hidden'); document.body.style.overflow='hidden';

'<div style="'+box+'"><p class="text-xs text-muted uppercase font-bold mb-1">Pengelola Admin TPP</p><p class="text-sm font-semibold">'+esc(a.nama||'Belum diisi')+'</p><p class="text-xs text-muted">'+esc(a.jabatan||'')+(a.pangkat?' • '+esc(a.pangkat):'')+(a.nip?' • NIP '+esc(a.nip):'')+'</p><p class="text-xs mt-1">'+metodeBadge(a.metode)+'</p>'+

(m.sig_kepala?'<div style="margin-top:8px;">'+qrBtn(m.sig_kepala)+'</div>':'')+'</div>'+
'<div style="'+box+'"><p class="text-xs text-muted uppercase font-bold mb-1">PIC Pendamping</p><p class="text-sm font-semibold">'+esc(m.pic_nama||'-')+'</p></div>';
if(m.ba_file_id) h+='<div style="'+box+'background:rgba(236,72,153,.06);border-color:var(--accent);"><p class="text-xs text-muted uppercase font-bold mb-1">Draft Berita Acara</p><p class="text-sm font-semibold">'+esc(m.ba_nomor)+'</p><p class="text-xs text-muted mt-1">Dibuat '+esc(m.ba_waktu)+' oleh '+esc(m.ba_oleh)+'</p><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;"><button onclick="previewDrive(\''+m.ba_file_id+'\',\'Draft Berita Acara\')" class="btn btn-secondary btn-sm"><i class="fas fa-eye"></i> Lihat Draft</button><button onclick="window.open(\''+driveDownload(m.ba_file_id)+'\',\'_blank\')" class="btn btn-success btn-sm"><i class="fas fa-download"></i> Unduh</button></div></div>';

else if(m.ba_file_id&&r.canUpload) h+='<div style="'+box+'background:rgba(245,158,11,.08);border-color:var(--warning);"><p class="text-sm">Belum ada unggahan dokumen final.</p><button onclick="askUploadBAFinal(\''+esc(skpd)+'\','+y+','+bl+')" class="btn btn-warning btn-sm mt-3"><i class="fas fa-upload"></i> Unggah Sekarang</button></div>';
if(r.isSuper&&m.id){

(m.ba_file_id?'<button onclick="unlockPeriode(\''+esc(skpd)+'\','+y+','+bl+')" class="btn btn-warning btn-sm"><i class="fas fa-lock-open"></i> Buka Kunci Saja</button>':'')+
'<button onclick="hapusPeriodeTPP(\''+esc(skpd)+'\','+y+','+bl+')" class="btn btn-danger btn-sm"><i class="fas fa-trash-can"></i> Hapus Data Periode</button>'+
'</div></div>';

}).withFailureHandler(function(er){ document.getElementById('modal-tpp-body').innerHTML='<p class="text-danger">'+esc(er.message)+'</p>'; }).getTPPDetail(skpd,y,bl,nid());
}




// ===== HAPUS DATA TPP TERPILIH =====
var hpData=null, hpSiap=false;

function ensureHapusMassalBtn(){
if(!isSuper()) return;
var page=document.getElementById('tpp-monitor'); if(!page) return;
var bar=page.querySelector('.section-actions'); if(!bar) return;
var old=document.getElementById('btn-hapus-massal'); if(old) old.remove();
var b=document.createElement('button');
b.id='btn-hapus-massal'; b.className='btn btn-danger btn-sm';
b.innerHTML='<i class="fas fa-trash-can"></i> Hapus Data Terpilih';
b.onclick=bukaHapusTPP;
bar.appendChild(b);
}

function hpPilihan(){
var sk=document.getElementById('hp-skpd').value;
var th=Number(document.getElementById('hp-tahun').value);
var bl=[], c=document.querySelectorAll('.hp-bulan');
for(var i=0;i<c.length;i++) if(c[i].checked) bl.push(Number(c[i].value));
return {skpd:sk==='ALL'?'ALL':[sk],tahun:th,bulan:bl};
}
function hpReset(){ hpSiap=false;
var b=document.getElementById('hp-proses'); if(b) b.disabled=true;
var p=document.getElementById('hp-preview');
if(p) p.innerHTML='<p class="text-xs text-muted"><i class="fas fa-circle-info mr-1"></i>Pilihan berubah. Klik <strong>Pratinjau</strong> ulang.</p>';
}
function hpUpdateBulan(){
if(!hpData) return;
var th=document.getElementById('hp-tahun').value, c=document.querySelectorAll('.hp-bulan');
for(var i=0;i<c.length;i++){
var n=hpData.rekap[th+'|'+c[i].value]||0;
var s=document.getElementById('hp-n-'+c[i].value);
if(s) s.textContent='('+n+')';
}
hpReset();
}
function hpPilihBulan(mode){
var c=document.querySelectorAll('.hp-bulan');
for(var i=0;i<c.length;i++){
var v=Number(c[i].value);
c[i].checked=(mode==='semua')||(mode==='janokt'&&v<=10)||(mode==='satu'&&v===(new Date().getMonth()+1));
if(mode==='kosong') c[i].checked=false;
}
hpReset();
}

function bukaHapusTPP(){
if(!isSuper()){ toast('Tidak Berwenang','Hanya Superadmin.','fas fa-lock','text-warning'); return; }
toast('Memuat','Menyiapkan pilihan SKPD & periode...','fas fa-spinner fa-spin','text-primary');
google.script.run.withSuccessHandler(function(r){
if(!r||!r.success){ toast('Gagal',(r&&r.message)||'Gagal','fas fa-times-circle','text-danger'); return; }
hpData=r; hpSiap=false;
var old=document.getElementById('modal-hapus-tpp'); if(old) old.remove();
var so='<option value="ALL">— Semua SKPD (54) —</option>';
for(var i=0;i<r.skpd.length;i++) so+='<option value="'+esc(r.skpd[i].nama)+'">'+esc(r.skpd[i].nama)+'</option>';
var to=''; for(var j=0;j<r.tahun.length;j++) to+='<option value="'+r.tahun[j]+'">'+r.tahun[j]+'</option>';
var bo='';
for(var b=1;b<=12;b++){
var n=r.rekap[r.tahun[0]+'|'+b]||0;
bo+='<label style="display:flex;align-items:center;gap:6px;padding:7px 9px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-muted);cursor:pointer;font-size:.8125rem;">'+
'<input type="checkbox" class="hp-bulan" value="'+b+'" onchange="hpReset()" style="width:17px;height:17px;accent-color:#ef4444;">'+
'<span style="font-weight:600;">'+BULAN_S[b-1]+'</span><span id="hp-n-'+b+'" class="text-xs text-muted">('+n+')</span></label>';
}
var w=document.createElement('div');
w.id='modal-hapus-tpp'; w.style.cssText='position:fixed;inset:0;z-index:246;';
w.innerHTML='<div class="modal-backdrop" onclick="tutupHapusMassal()"></div>'+
'<div class="modal-content" style="max-width:780px;">'+
'<div class="modal-header" style="background:linear-gradient(135deg,#ef4444,#b91c1c);">'+
'<div style="min-width:0;flex:1;"><h3>Hapus Data Persetujuan TPP</h3>'+
'<p class="text-xs mt-0.5" style="opacity:.9;">Pilih SKPD &amp; periode yang akan dihapus</p></div>'+
'<button onclick="tutupHapusMassal()" class="modal-close"><i class="fas fa-times"></i></button></div>'+
'<div class="modal-body" style="max-height:70vh;overflow:auto;">'+
'<div class="form-row two-col">'+
'<div><label class="form-label">SKPD</label><select id="hp-skpd" class="form-select" onchange="hpReset()">'+so+'</select></div>'+
'<div><label class="form-label">Tahun</label><select id="hp-tahun" class="form-select" onchange="hpUpdateBulan()">'+to+'</select></div>'+
'</div>'+
'<div class="form-row"><div><label class="form-label">Periode (boleh lebih dari satu)</label>'+
'<div class="filter-group mb-2">'+
'<button type="button" onclick="hpPilihBulan(\'semua\')" class="filter-btn">Semua Bulan</button>'+
'<button type="button" onclick="hpPilihBulan(\'janokt\')" class="filter-btn">Jan–Okt</button>'+
'<button type="button" onclick="hpPilihBulan(\'satu\')" class="filter-btn">Bulan Ini</button>'+
'<button type="button" onclick="hpPilihBulan(\'kosong\')" class="filter-btn">Kosongkan</button></div>'+
'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px;">'+bo+'</div>'+
'<p class="text-xs text-muted mt-2">Angka dalam kurung = jumlah data yang tersimpan pada bulan tersebut.</p></div></div>'+
'<div class="form-row"><div><button type="button" onclick="hpPratinjau()" class="btn btn-secondary btn-sm"><i class="fas fa-magnifying-glass"></i> Pratinjau Data yang Akan Dihapus</button></div></div>'+
'<div id="hp-preview" class="form-card" style="margin:0 0 14px;"><p class="text-xs text-muted"><i class="fas fa-circle-info mr-1"></i>Pilih SKPD &amp; periode, lalu klik Pratinjau.</p></div>'+
'<div class="form-row"><div><label class="form-label">Ketik <strong>HAPUS</strong> untuk konfirmasi</label>'+
'<input type="text" id="hp-konfirm" class="form-input" placeholder="HAPUS" autocomplete="off" oninput="hpCekSiap()"></div></div>'+
'<div class="flex flex-wrap gap-3 pt-4 border-t" style="border-color:var(--border);">'+
'<button id="hp-proses" onclick="hpEksekusi()" class="btn btn-danger" disabled><i class="fas fa-trash-can"></i> Hapus Permanen</button>'+
'<button onclick="tutupHapusMassal()" class="btn btn-secondary">Batal</button></div>'+
'</div></div>';
document.body.appendChild(w);
document.body.style.overflow='hidden';
}).withFailureHandler(fail).getOpsiHapusTPP(nid());
}

function hpCekSiap(){
var k=document.getElementById('hp-konfirm'), b=document.getElementById('hp-proses');
if(!b) return;
b.disabled=!(hpSiap&&k&&String(k.value).trim().toUpperCase()==='HAPUS');
}

function hpPratinjau(){
var o=hpPilihan(), p=document.getElementById('hp-preview');
if(!o.bulan.length){ p.innerHTML='<p class="text-xs text-danger"><i class="fas fa-triangle-exclamation mr-1"></i>Pilih minimal satu bulan.</p>'; return; }
p.innerHTML='<p class="text-xs text-muted"><i class="fas fa-circle-notch fa-spin mr-1"></i>Memeriksa data...</p>';
google.script.run.withSuccessHandler(function(r){
if(!r||!r.success){ hpSiap=false; hpCekSiap(); p.innerHTML='<p class="text-xs text-danger">'+esc((r&&r.message)||'Gagal')+'</p>'; return; }
if(!r.jumlah){ hpSiap=false; hpCekSiap();
p.innerHTML='<p class="text-xs text-muted"><i class="fas fa-circle-check mr-1"></i>Tidak ada data pada pilihan ini — tidak ada yang perlu dihapus.</p>'; return; }
var h='<div style="display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:10px;">'+
'<span class="badge badge-danger">'+r.jumlah+' baris data</span>'+
'<span class="badge badge-warning">'+r.file+' file Drive</span>'+
'<span class="badge badge-super">'+r.ttd+' tanda tangan elektronik</span></div>';
h+='<div class="table-wrapper" style="margin:0;"><div class="table-scroll" style="max-height:260px;"><table class="data-table">'+
'<thead><tr><th>SKPD</th><th>Periode</th><th>Status</th><th>Dokumen</th></tr></thead><tbody>';
for(var i=0;i<r.detail.length;i++){
var x=r.detail[i];
var dok=(x.adaBa?'<span class="badge badge-info">Draft BA</span> ':'')+(x.adaUnggahan?'<span class="badge badge-success">Unggahan</span>':'')+(!x.adaBa&&!x.adaUnggahan?'<span class="text-muted text-xs">—</span>':'');
h+='<tr><td style="font-size:.8125rem;">'+esc(x.skpd)+'<div class="subtitle">'+esc(x.pic)+'</div></td>'+
'<td><span class="badge badge-secondary">'+esc(x.bulanNama)+' '+x.tahun+'</span>'+(x.historis?' <span class="badge badge-secondary">Historis</span>':'')+'</td>'+
'<td>'+esc(x.status)+'</td><td>'+dok+'</td></tr>';
}
h+='</tbody></table></div></div>';
if(r.lebih>0) h+='<p class="text-xs text-muted mt-2">…dan '+r.lebih+' baris lainnya (total '+r.jumlah+').</p>';
h+='<p class="text-xs text-danger mt-2"><i class="fas fa-triangle-exclamation mr-1"></i>Seluruh baris di atas akan dihapus permanen dari Data_TPP. File dipindah ke Trash Drive; tanda tangan elektronik dicabut.</p>';
p.innerHTML=h;
hpSiap=true; hpCekSiap();
}).withFailureHandler(function(e){ hpSiap=false; hpCekSiap(); p.innerHTML='<p class="text-xs text-danger">'+esc(e.message)+'</p>'; })
.previewHapusTPP(o,nid());
}

function hpEksekusi(){
if(!hpSiap){ toast('Pratinjau Dulu','Klik Pratinjau sebelum menghapus.','fas fa-triangle-exclamation','text-warning'); return; }
var o=hpPilihan(), b=document.getElementById('hp-proses'), oh=b.innerHTML;
b.disabled=true; b.innerHTML='<i class="fas fa-spinner fa-spin"></i> Menghapus...';
google.script.run.withSuccessHandler(function(r){
b.innerHTML=oh;
if(r&&r.success){
toast('Terhapus',r.message,'fas fa-trash','text-success');
tutupHapusMassal();
if(typeof loadTPPMonitor==='function') loadTPPMonitor();
if(typeof refreshTPPViews==='function') refreshTPPViews();
}else{ b.disabled=false; toast('Gagal',(r&&r.message)||'Gagal','fas fa-times-circle','text-danger'); }
}).withFailureHandler(function(e){ b.innerHTML=oh; b.disabled=false; fail(e); })
.hapusTPPTerpilih(o,nid());
}

function tutupHapusMassal(){
var m=document.getElementById('modal-hapus-tpp'); if(m) m.remove();
document.body.style.overflow='';
hpSiap=false;
}



</script>
